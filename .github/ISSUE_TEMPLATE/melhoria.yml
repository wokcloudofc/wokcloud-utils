name: Propor uma melhoria
description: Explicar uma necessidade e o resultado pretendido.
title: '[Melhoria] '
body:
  - type: textarea
    id: need
    attributes:
      label: Qual é a necessidade?
      description: Descreve a tarefa que queres realizar e a dificuldade atual.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Resultado esperado
      description: Inclui exemplos e critérios que permitam verificar a melhoria.
    validations:
      required: true
